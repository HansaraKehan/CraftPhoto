name: Build and release Android APK

# Builds the newest upstream PhotoCraft RELEASE (storytold/photocraft, its latest release tag, so
# the APK is exactly that version) with the Android layer and the English translation applied on top,
# then publishes the APK as a GitHub Release named after that version (android-v0.20.2).
# It checks every night but only builds when upstream has published a release this repository has
# no release for yet: no new upstream release means no release here.
#
# Run it by hand with "Publish a release" switched off to only build: the signed APK is kept as a
# download on the run page (Artifacts) and nothing is released, tagged or committed.
#
# Everything about the layer itself (how it is applied, the release notes, the features list)
# lives inside android-layer/android-layer.tar.gz, so this file rarely needs editing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag, branch or commit to build (empty = upstream's latest release)"
        required: false
        default: ""
      force:
        description: "Build again even if this upstream version already has a release"
        type: boolean
        default: false
      publish:
        description: "Publish a release (switch off to only build the APK and download it from this run)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/photocraft
  TARGET: aarch64-linux-android
  NDK_VERSION: 28.2.13676358
  BT_VERSION: 35.0.0
  MIN_RUST: "1.95"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Pick the upstream version
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          VAR_REF: ${{ vars.UPSTREAM_REF }}
        run: |
          # A typed ref wins, then the UPSTREAM_REF variable, then upstream's latest release.
          REF="${INPUT_REF:-$VAR_REF}"
          if [ -z "$REF" ]; then
            REF=$(gh release list --repo "$UPSTREAM" --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          fi
          if [ -z "$REF" ]; then
            echo "Upstream has no release yet: nothing to build."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building upstream $REF"
            { echo "found=true"; echo "ref=$REF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Check out this repository (the Android layer lives here)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream PhotoCraft
        if: steps.ref.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: src

      - name: Work out the release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          FOUND: ${{ steps.ref.outputs.found }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if [ "$FOUND" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled runs have no inputs: they always publish.
          PUBLISH="${INPUT_PUBLISH:-true}"
          SHA=$(git -C src rev-parse --short=7 HEAD)
          # An upstream release builds as that version: its number comes from the tag, never from the
          # Cargo.toml of whatever branch happens to be checked out. Anything else (a branch or
          # commit typed by hand) takes the version from Cargo.toml and a commit suffix.
          if gh release view "$REF" --repo "$UPSTREAM" > /dev/null 2>&1; then
            VER="${REF#v}"
            TAG="android-v${VER}"
            IS_RELEASE=true
          else
            VER=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
            TAG="android-v${VER}-${SHA}"
            IS_RELEASE=false
          fi
          SKIP=false
          if [ "$PUBLISH" = "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              # Same upstream version, new Android layer: publish it as a new release.
              TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            else
              echo "Release $TAG already exists - nothing to do."
              SKIP=true
            fi
          fi
          {
            echo "version=$VER"
            echo "sha=$SHA"
            echo "tag=$TAG"
            echo "skip=$SKIP"
            echo "publish=$PUBLISH"
            echo "is_release=$IS_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Add the Android layer on top of upstream
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/layer"
          tar xzf ../fork/android-layer/android-layer.tar.gz -C "$RUNNER_TEMP/layer"
          # The zip carries its own applier (patch with fallbacks, overlay, translation). It names the
          # files that conflict if upstream changed something the layer cannot absorb.
          python3 "$RUNNER_TEMP/layer/apply_layer.py"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust version upstream asks for
        if: steps.ver.outputs.skip != 'true'
        run: |
          RUSTV=$(grep -m1 '^rust-version' src/Cargo.toml | cut -d'"' -f2)
          # Never go below MIN_RUST (the egui family needs it even where the workspace says less).
          RUSTV=$(printf '%s\n%s\n' "${RUSTV:-$MIN_RUST}" "$MIN_RUST" | sort -V | tail -n1)
          rustup toolchain install "$RUSTV" --profile minimal --target "$TARGET"
          rustup default "$RUSTV"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src
          key: android-arm64

      - name: Install Android SDK parts
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BT_VERSION}" "ndk;${NDK_VERSION}"

      - name: Build native library (Rust)
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build -p photocraft-android --target "$TARGET" --release -j 3

      - name: Restore signing key
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/photocraft-signing
          key: photocraft-signing-v1

      - name: Create signing key if missing
        if: steps.ver.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/photocraft-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/photocraft-signing/key.p12
            printf '%s' "$KS_PASS" > ~/photocraft-signing/password.txt
          elif [ ! -f ~/photocraft-signing/key.p12 ]; then
            openssl rand -base64 24 > ~/photocraft-signing/password.txt
            keytool -genkeypair -keystore ~/photocraft-signing/key.p12 -storetype PKCS12 \
              -storepass:file ~/photocraft-signing/password.txt -alias photocraft \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=PhotoCraft Personal Android Build"
          fi

      - name: Package and sign the APK
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BT_VERSION}"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          B="$RUNNER_TEMP/apk"
          mkdir -p "$B/classes" "$B/dex" "$B/res/drawable" dist
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.photocraft.png "$B/res/drawable/icon.png"

          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d "$B/classes" \
            packaging/android/java/ai/storyteller/photocraft/*.java
          jar cf "$B/classes.jar" -C "$B/classes" .
          "$BT/d8" --release --min-api 28 --lib "$PLATFORM" --output "$B/dex" "$B/classes.jar"
          "$BT/aapt2" compile --dir "$B/res" -o "$B/resources.zip"
          "$BT/aapt2" link -I "$PLATFORM" --manifest packaging/android/AndroidManifest.xml \
            --version-code "$(( $(date +%s) / 60 ))" --version-name "${VERSION}-android.${GITHUB_RUN_NUMBER}" \
            -o "$B/unsigned.apk" "$B/resources.zip"

          B="$B" LIB="target/${TARGET}/release/libphotocraft_android.so" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          b = Path(os.environ["B"])
          with zipfile.ZipFile(b / "unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(b / "dex/classes.dex", "classes.dex")
              z.write(os.environ["LIB"], "lib/arm64-v8a/libphotocraft_android.so")
              for p in ["LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md", "ATTRIBUTION-ANDROID.md",
                        "assets/app-icon/LICENSE.txt", "vendor/winit/LICENSE"]:
                  if Path(p).exists():
                      z.write(p, "assets/licenses/" + p.replace("/", "_"))
          PY

          "$BT/zipalign" -f -P 16 4 "$B/unsigned.apk" "$B/aligned.apk"
          APK="dist/PhotoCraft-${VERSION}-android-arm64-v8a.apk"
          "$BT/apksigner" sign --ks ~/photocraft-signing/key.p12 --ks-key-alias photocraft \
            --ks-pass "file:$HOME/photocraft-signing/password.txt" --out "$APK" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Keep the APK (build only)
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-android-apk
          path: src/dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # Release notes, in this order:
          #  1. The Android features that are new in this build: the topmost "## ..." section of
          #     whats-new.md inside the layer zip (written for you with every zip). Left out when it is
          #     the same section the previous release already showed, so old news never repeats.
          #  2. What changed upstream since the previous release.
          #  3. Install notes.
          NEWS="$RUNNER_TEMP/layer/whats-new.md"
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --exclude-drafts --json tagName --jq '[.[] | select(.tagName | startswith("android-v"))][0].tagName' 2>/dev/null || true)
          # The upstream version the previous release was built from (android-v0.20.1[-suffix] -> v0.20.1).
          PREV_VER=$(printf '%s' "$PREV_TAG" | sed -nE 's/^android-v([0-9][^-]*).*/\1/p')
          PREV_BODY=""
          if [ -n "$PREV_TAG" ]; then
            PREV_BODY=$(gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          fi
          TOP=""
          if [ -f "$NEWS" ]; then
            TOP=$(awk '/^## /{ if (seen) exit; seen = 1; next } seen' "$NEWS")
          fi
          TOP_ID=$(printf '%s' "$TOP" | sha1sum | cut -c1-12)
          {
            if [ -n "$(printf '%s' "$TOP" | tr -d '[:space:]')" ] && ! printf '%s' "$PREV_BODY" | grep -qF "android-news:${TOP_ID}"; then
              HEAD=$(awk '/^## /{ sub(/^## /, ""); print; exit }' "$NEWS")
              echo "## New in the Android edition: ${HEAD}"
              echo
              printf '%s\n' "$TOP"
              echo
            fi
            echo "## Changes from upstream"
            echo
            PREV_UP="v${PREV_VER}"
            if [ -z "$PREV_VER" ] || ! git rev-parse -q --verify "refs/tags/${PREV_UP}^{commit}" > /dev/null; then
              echo "First build, or the previous version's upstream tag is not available."
            elif [ "$PREV_VER" = "$VERSION" ]; then
              echo "Same upstream version as the previous build (${VERSION}): only the Android edition changed."
            else
              COUNT=$(git rev-list --no-merges --count "${PREV_UP}..HEAD")
              echo "${COUNT} upstream change(s) from ${PREV_UP} to ${REF} (\`${SHA}\`):"
              echo
              git log --no-merges --max-count=40 --pretty='- %s' "${PREV_UP}..HEAD"
              if [ "$COUNT" -gt 40 ]; then echo "- …and $((COUNT - 40)) more"; fi
            fi
            # Upstream's own release notes for this version.
            if gh release view "$REF" --repo "$UPSTREAM" --json body --jq .body > upstream-raw.md 2>/dev/null && [ -s upstream-raw.md ]; then
              echo
              echo "### Upstream ${VERSION} release notes"
              echo
              # Without GitHub's "New Contributors" section and the "by @user in <PR>" suffixes.
              awk '/^#+[ \t]*New Contributors[ \t]*$/ { skip = 1; next } /^#+[ \t]/ { skip = 0 } !skip' upstream-raw.md | sed -E 's/ by @[^ ]+ in [^ ]+[[:space:]]*$//'
            fi
            echo
            echo "## About this build"
            echo "**PhotoCraft ${VERSION} for Android** (English, ARM64), built automatically from upstream \`${UPSTREAM}\` ${REF} (commit \`${SHA}\`) with the Android edition's layer and English translation applied."
            echo
            echo "- Needs an ARM64 phone or tablet running Android 9 or newer."
            echo "- Download the \`.apk\`, open it, and allow installs from your file manager or browser when Android asks."
            echo "- Unofficial build, not made or supported by the PhotoCraft team. If an update will not install over an older build, uninstall the old one first."
            echo
            echo "<!-- android-news:${TOP_ID} -->"
          } > notes.md
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PhotoCraft ${VERSION} Android" --notes-file notes.md

      - name: Keep the README's Android features list current
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: fork
        run: |
          # Every "- " feature line of whats-new.md (all sections, so a feature stays listed after it
          # stops being news) goes between the markers in README.md. Fixes are written with "* " and
          # are not listed. If the markers are missing they are added at the end of the README.
          python3 - "$RUNNER_TEMP/layer/whats-new.md" <<'PY'
          import re, sys, pathlib
          news = pathlib.Path(sys.argv[1])
          if not news.exists():
              sys.exit(0)
          features = [l.rstrip() for l in news.read_text(encoding="utf-8").splitlines() if l.startswith("- ")]
          start, end = "<!-- android-features:start -->", "<!-- android-features:end -->"
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8") if readme.exists() else ""
          if start not in text:
              text = text.rstrip() + f"\n\n## Android features\n\nKept up to date automatically from each release.\n\n{start}\n{end}\n"
          block = start + "\n" + "\n".join(features) + "\n" + end
          text = re.sub(re.escape(start) + r".*?" + re.escape(end), lambda m: block, text, flags=re.S)
          readme.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update the Android features list in README [skip ci]"
            BR="${GITHUB_REF_NAME}"
            git pull --rebase -q origin "$BR" || true
            git push origin "HEAD:${BR}" || echo "::warning::couldn't push the README update (the branch moved meanwhile)"
          fi
